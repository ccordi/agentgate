[project]
name = "agentgate"
version = "0.0.1"
description = "A reverse proxy that adds controls and monitoring between an agent application and its model."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "cryptography>=43",
    # Prometheus metrics are always served at /metrics. OpenTelemetry is in the optional
    # `tracing` extra because tracing is off by default.
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# The classifier (ONNX Runtime, no PyTorch). The heuristic scanner needs no extra.
guard = [
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "numpy>=2.0",
]
# Postgres audit-store backend (SQLAlchemy `postgresql+asyncpg://` URLs). The default
# store stays SQLite; the suite runs against Postgres via scripts/test_postgres.sh.
pg = [
    "asyncpg>=0.30",
]
# The LiteLLM guardrail plugin. Pinned to the LiteLLM version it was tested with, because
# it relies on LiteLLM internals. Add `guard` for the classifier.
litellm-plugin = [
    "litellm[proxy]==1.95.1",
    # LiteLLM's proxy imports fastapi.dependencies.utils.get_flat_dependant, which
    # FastAPI 0.141 removed, and sets no upper bound on FastAPI itself.
    "fastapi<0.141",
]
# The HTTP tool's MCP server, which asks the gateway to check each request before
# sending it.
egress-mcp = [
    "mcp>=1.2",
]
# OpenTelemetry tracing, off by default. With AGENTGATE_OTLP_ENDPOINT set, the gateway
# exports a metadata-only span per handled request, never message content.
tracing = [
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
]

[project.scripts]
agentgate = "agentgate.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: needs a running gateway/model server"]
# Live tests are opt-in: `uv run pytest -m live` (a bare -m on the command line wins).
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Injection / secret-pattern signal tables: regexes are most legible on one line each.
"src/agentgate/guards/heuristic.py" = ["E501"]
"src/agentgate/sensitivity.py" = ["E501"]
"src/agentgate/redaction.py" = ["E501"]
"src/agentgate/tool_inspector.py" = ["E501"]
# Tests carry inline SSE/JSON fixtures that don't wrap cleanly.
"tests/*" = ["E501"]


# Dev tooling. uv installs the `dev` group by default (PEP 735), so `uv run pytest`
# and `uv sync` pick it up with no extra flags. Single source of truth for dev deps.
[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.mypy]
python_version = "3.13"
# Only the gateway package is type-checked.
files = ["src/agentgate"]
# Third-party deps without stubs (mcp, onnxruntime, …). Our own modules
# are on the path, so import breaks in this tree still surface.
ignore_missing_imports = true
check_untyped_defs = true
